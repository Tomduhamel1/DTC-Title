services:
  postgres:
    image: postgres:16-alpine
    container_name: betterclose-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: betterclose
      POSTGRES_PASSWORD: betterclose
      POSTGRES_DB: betterclose
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betterclose"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
