name: Garden ingest contract
on:
  pull_request:
    paths: ['src/lib/closing/**', 'src/lib/teammate/match.ts', 'src/lib/email/*-ops.ts', 'src/app/api/orders/ingest/**', 'src/app/api/tps/closings/**', 'src/app/api/admin/closing/**', 'src/components/admin/ClosingEditor.tsx', 'prisma/**', 'package*.json', '.nvmrc', 'test/garden-*', '.github/workflows/garden-ingest-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garden_ldi_betterclose_receiver
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/garden_ldi_betterclose_receiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node --test --test-concurrency=1 test/garden-ingest.pg.test.cjs test/garden-request-link.pg.test.cjs
