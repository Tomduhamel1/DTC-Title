name: Release typecheck
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:release-types
      - run: npm run test:auth-security
      - run: npm run test:aws-compatibility
      - run: npm run test:email-design
  email-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The hosted runner already includes Chrome. Avoid an unbounded download
      # of Puppeteer's legacy bundled browser before any test can even start.
      - name: Verify the runner browser and run every offline layout test
        run: |
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          "$browser_path" --version
          PUPPETEER_EXECUTABLE_PATH="$browser_path" npm run test:email-layout
